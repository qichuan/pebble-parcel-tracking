<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcel Tracking Settings</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f5; color: #000;
    margin: 0; padding: 24px 16px; max-width: 460px; margin-inline: auto;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #eee; }
    .sub { color: #bbb !important; }
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  .sub { color: #555; margin: 0 0 20px; font-size: 14px; }
  .card {
    background: #fff; color: #000; border-radius: 12px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 12px;
  }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 15px; background: #fff; color: #000;
    border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px;
  }
  input:last-of-type { margin-bottom: 0; }
  .hint { font-size: 12px; color: #555; margin: 4px 0 0; }
  .hint a { color: #c2410c; }
  .row-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .row-head b { font-size: 13px; color: #555; letter-spacing: .04em; }
  .remove {
    background: none; border: 0; color: #b91c1c; font-size: 13px;
    font-weight: 600; padding: 2px 4px; cursor: pointer; width: auto;
  }
  .cols { display: flex; gap: 8px; }
  .cols > div { flex: 1; }
  button {
    width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 8px; cursor: pointer;
  }
  .primary { background: #ea580c; color: #fff; margin-top: 16px; }
  .secondary {
    background: #fff; color: #ea580c; border: 1px solid #ea580c;
  }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
  .warn { color: #b45309; }
  /* Courier picker: the list floats over whatever follows the card. */
  .cx { position: relative; }
  .cx-list {
    list-style: none; margin: 0; padding: 0; display: none;
    position: absolute; left: 0; right: 0; top: 100%; z-index: 20;
    max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #fff; color: #000;
    border: 1px solid #ccc; border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
  }
  .cx-list li {
    padding: 9px 12px; font-size: 15px; cursor: pointer;
    border-bottom: 1px solid #eee;
  }
  .cx-list li:last-child { border-bottom: 0; }
  .cx-list li.cx-active { background: #fff1e7; }
  .cx-list li .code { color: #777; font-size: 12px; margin-left: 6px; }
  .cx-more { color: #777; font-size: 12px; cursor: default !important; }
</style>
</head>
<body>
  <h1>Parcel Tracking</h1>
  <p class="sub">Watch your parcels from your wrist, powered by Ship24.</p>

  <div class="card">
    <label for="api_key">Ship24 API key</label>
    <input id="api_key" placeholder="Paste your API key"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="hint">Get one free at
      <a href="https://dashboard.ship24.com" target="_blank">dashboard.ship24.com</a>
      → Integrations → API Keys.</p>
  </div>

  <h2>Parcels</h2>
  <div id="parcels"></div>
  <button type="button" class="secondary" id="add">+ Add parcel</button>

  <button type="button" class="primary" id="save">Save</button>
  <p id="msg"></p>

<!-- Every active Ship24 courier, generated by tools/gen-couriers.js. The page
     still works without it: the courier field falls back to a plain code box. -->
<script src="couriers.js" charset="utf-8"></script>
<script>
(function () {
  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }
  function setMsg(text, cls) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = cls || '';
  }
  function trim(s) { return String(s == null ? '' : s).replace(/^\s+|\s+$/g, ''); }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
  }

  var returnTo = qs('return_to') || 'pebblejs://close#';
  var list = document.getElementById('parcels');

  // --- courier list ------------------------------------------------------
  // couriers.js packs one courier per line as "name|code", with a third field
  // holding an ASCII-folded name where the real one carries accents (so
  // "ceska" finds "Česká pošta"). Codes are what Ship24 wants; names are what
  // the user recognises, so the field shows the name and saves the code.
  var COURIERS = [];
  var BY_KEY = {}; // lowercased name, folded name and code -> courier
  try {
    var packed = window.COURIERS ? String(window.COURIERS).split('\n') : [];
    for (var c = 0; c < packed.length; c++) {
      var f = packed[c].split('|');
      if (f.length < 2 || !f[0] || !f[1]) continue;
      var item = { name: f[0], code: f[1],
                   lower: f[0].toLowerCase(), fold: (f[2] || f[0]).toLowerCase() };
      COURIERS.push(item);
      if (!BY_KEY[item.lower]) BY_KEY[item.lower] = item;
      if (!BY_KEY[item.fold]) BY_KEY[item.fold] = item;
      if (!BY_KEY[item.code]) BY_KEY[item.code] = item;
    }
  } catch (e) { COURIERS = []; }
  var HAS_LIST = COURIERS.length > 0;
  var MAX_MATCHES = 40;

  // Best matches first: the exact code, then names starting with what was
  // typed, then codes, then anything containing it. 1600-odd entries is a
  // sub-millisecond scan, so this runs on every keystroke without a debounce.
  function matchCouriers(query) {
    var q = trim(query).toLowerCase();
    if (!q) return COURIERS.slice(0, MAX_MATCHES);
    var exact = [], namePre = [], codePre = [], rest = [];
    for (var i = 0; i < COURIERS.length; i++) {
      var it = COURIERS[i];
      if (it.code === q) exact.push(it);
      else if (it.lower.indexOf(q) === 0 || it.fold.indexOf(q) === 0) namePre.push(it);
      else if (it.code.indexOf(q) === 0) codePre.push(it);
      else if (it.lower.indexOf(q) !== -1 || it.fold.indexOf(q) !== -1 ||
               it.code.indexOf(q) !== -1) rest.push(it);
    }
    return exact.concat(namePre, codePre, rest);
  }

  // What this card should save: the code behind the picked courier, a code
  // typed by hand (an unlisted or brand-new one still has to work), blank for
  // "let Ship24 detect it", or null when the text is nothing we can use.
  function resolveCourier(card) {
    var typed = trim(card.querySelector('.cx-input').value);
    if (!typed) return '';
    var picked = card.querySelector('.courier').value;
    if (picked) return picked; // chosen from the list, text untouched since
    var hit = BY_KEY[typed.toLowerCase()];
    if (hit) return hit.code;
    if (/^[a-z0-9][a-z0-9-]*$/i.test(typed)) return typed.toLowerCase();
    return null;
  }

  // Wires one card's courier input to its dropdown.
  function wireCourier(card) {
    var input = card.querySelector('.cx-input');
    var hidden = card.querySelector('.courier');
    var menu = card.querySelector('.cx-list');
    var shown = [];
    var active = -1;
    var hideTimer = null;

    function close() {
      menu.style.display = 'none';
      menu.innerHTML = '';
      shown = [];
      active = -1;
    }

    function highlight(next) {
      var rows = menu.getElementsByTagName('li');
      if (active >= 0 && rows[active]) rows[active].className = '';
      active = next;
      if (active >= 0 && rows[active]) {
        rows[active].className = 'cx-active';
        if (rows[active].scrollIntoView) rows[active].scrollIntoView(false);
      }
    }

    function pick(item) {
      input.value = item.name;
      hidden.value = item.code;
      close();
    }

    function open() {
      var found = matchCouriers(input.value);
      if (!found.length) return close();
      shown = found.slice(0, MAX_MATCHES);
      var html = '';
      for (var i = 0; i < shown.length; i++) {
        html += '<li data-i="' + i + '">' + escapeHtml(shown[i].name) +
                '<span class="code">' + escapeHtml(shown[i].code) + '</span></li>';
      }
      if (found.length > shown.length) {
        html += '<li class="cx-more">' + (found.length - shown.length) +
                ' more — keep typing</li>';
      }
      menu.innerHTML = html;
      menu.style.display = 'block';
      active = -1;
    }

    // mousedown, not click: it fires before the input's blur closes the menu.
    menu.addEventListener('mousedown', function (e) {
      var el = e.target;
      while (el && el !== menu && el.nodeName !== 'LI') el = el.parentNode;
      if (!el || el === menu) return;
      var i = el.getAttribute('data-i');
      if (i === null) return; // the "keep typing" row
      e.preventDefault();
      pick(shown[Number(i)]);
    });

    input.addEventListener('input', function () {
      hidden.value = ''; // typing invalidates whatever was picked
      open();
    });
    input.addEventListener('focus', open);
    input.addEventListener('blur', function () {
      hideTimer = setTimeout(close, 200); // let a tap land first
    });
    input.addEventListener('mousedown', function () {
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    });
    input.addEventListener('keydown', function (e) {
      var key = e.keyCode;
      if (key === 40 || key === 38) { // down / up
        if (menu.style.display !== 'block') open();
        if (!shown.length) return;
        e.preventDefault();
        var next = active + (key === 40 ? 1 : -1);
        if (next < 0) next = shown.length - 1;
        if (next >= shown.length) next = 0;
        highlight(next);
      } else if (key === 13) { // enter
        if (active >= 0 && shown[active]) { e.preventDefault(); pick(shown[active]); }
      } else if (key === 27) { // escape
        close();
      }
    });
  }

  if (qs('has_key') === '1') {
    document.getElementById('api_key').placeholder = '•••••• (unchanged)';
  }

  // One card per parcel. Rows are read back off the DOM on save, so there's no
  // separate model to keep in sync.
  function addRow(parcel) {
    parcel = parcel || {};
    var card = document.createElement('div');
    card.className = 'card parcel';
    card.innerHTML =
      '<div class="row-head"><b>PARCEL</b>' +
      '<button type="button" class="remove">Remove</button></div>' +
      '<label>Name</label>' +
      '<input class="nickname" placeholder="Headphones" maxlength="36">' +
      '<label>Tracking number</label>' +
      '<input class="number" placeholder="1234567890AB" maxlength="64" ' +
      'autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">' +
      '<label>Courier <span style="font-weight:400">(optional)</span></label>' +
      '<div class="cx">' +
      '<input class="cx-input" maxlength="64" ' +
      'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
      '<input type="hidden" class="courier">' +
      '<ul class="cx-list"></ul>' +
      '</div>' +
      '<p class="hint">Leave the courier blank to let Ship24 detect it.</p>';
    card.querySelector('.nickname').value = parcel.nickname || '';
    card.querySelector('.number').value = parcel.trackingNumber || '';

    // A stored code we know becomes its courier's name; one we don't (a
    // deprecated or brand-new code) is shown as-is and saves unchanged.
    var courierInput = card.querySelector('.cx-input');
    var stored = trim(parcel.courierCode).toLowerCase();
    courierInput.placeholder = HAS_LIST ? 'Search by courier name' : 'dhl';
    if (stored) {
      var known = BY_KEY[stored];
      courierInput.value = known ? known.name : stored;
      card.querySelector('.courier').value = known ? known.code : stored;
    }
    if (HAS_LIST) wireCourier(card);

    card.querySelector('.remove').addEventListener('click', function () {
      list.removeChild(card);
      renumber();
    });
    list.appendChild(card);
    renumber();
  }

  function renumber() {
    var cards = list.querySelectorAll('.parcel');
    for (var i = 0; i < cards.length; i++) {
      cards[i].querySelector('b').textContent = 'PARCEL ' + (i + 1);
    }
  }

  var existing = [];
  try { existing = JSON.parse(qs('parcels') || '[]'); } catch (e) {}
  for (var i = 0; i < existing.length; i++) addRow(existing[i]);
  if (!existing.length) addRow();

  document.getElementById('add').addEventListener('click', function () {
    if (list.querySelectorAll('.parcel').length >= 12) {
      setMsg('The watch shows at most 12 parcels.', 'warn');
      return;
    }
    setMsg('');
    addRow();
  });

  document.getElementById('save').addEventListener('click', function () {
    var cards = list.querySelectorAll('.parcel');
    var parcels = [];
    var seen = {};
    for (var i = 0; i < cards.length; i++) {
      var number = trim(cards[i].querySelector('.number').value).replace(/\s+/g, '');
      if (!number) continue; // an empty card just means "not filled in"
      if (seen[number]) {
        setMsg('Tracking number ' + number + ' is listed twice.', 'warn');
        return;
      }
      seen[number] = true;
      var courier = resolveCourier(cards[i]);
      if (courier === null) {
        setMsg('Parcel ' + (i + 1) + ': pick a courier from the list, ' +
               'or leave it blank.', 'warn');
        return;
      }
      parcels.push({
        nickname: trim(cards[i].querySelector('.nickname').value) || number,
        trackingNumber: number,
        courierCode: courier,
      });
    }

    var key = trim(document.getElementById('api_key').value);
    if (!key && qs('has_key') !== '1') {
      setMsg('Enter your Ship24 API key.', 'warn');
      return;
    }

    var payload = { action: 'save', parcels: parcels };
    if (key) payload.apiKey = key;
    setMsg('Saving…');
    location.href = returnTo + encodeURIComponent(JSON.stringify(payload));
  });
})();
</script>
</body>
</html>
